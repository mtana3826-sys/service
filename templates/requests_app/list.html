<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Заявки</title>
</head>
<body>
    <h1>Заявки на ремонт</h1>

    <p>Пользователь: {{ request.user.phone }}</p>
    <a href="{% url 'logout' %}">Выйти</a>

    {% if request.user.role == "employee" %}
        <p><a href="{% url 'request_create' %}">Создать заявку</a></p>
    {% endif %}

    {% for item in requests %}
        <div>
            <h3>Заявка №{{ item.pk }}</h3>
            <p>{{ item.description }}</p>
            <p>Статус: {{ item.get_status_display }}</p>
            <a href="{% url 'request_detail' item.pk %}">Открыть</a>
        </div>
        <hr>
    {% empty %}
        <p>Заявок пока нет.</p>
    {% endfor %}
</body>
</html>
